name: CodeQL

# 为什么本仓也要扫：六个仓里只有 site 没有启用 Code Scanning（其余五仓都有 codeql.yml）。
# 站点虽然是文档工程，但同样有 TypeScript/JS 源码（`docs/.vitepress/**`、`scripts/**`、`tools/**`），
# 且这些脚本会读写仓库文件与生成站点产物——纳入静态安全扫描与其它仓保持一致。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL 静态安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [ javascript-typescript ]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # 排除构建产物与缓存（站点构建会生成 docs/.vitepress/dist，不应进安全面板）
          config-file: ./.github/codeql/codeql-config.yml

      - name: 安装依赖（让 CodeQL 能看到解析后的模块图）
        run: pnpm install --frozen-lockfile

      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v4
