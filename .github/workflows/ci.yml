name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate configuration reference
        run: pnpm docs:config
      - name: Validate screenshot artifacts
        run: pnpm screenshots:validate
      - name: Typecheck
        run: pnpm typecheck
      - name: Scan content claims
        run: pnpm check:content
      - name: Build site
        run: pnpm build
